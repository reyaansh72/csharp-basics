<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# Basics - Web Book</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Marked.js for Markdown & Highlight.js for Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/csharp.min.js"></script>
    <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">

    <style>
        :root {
            /* Base Dynamic HSL Hue (Default: Material Violet/Indigo) */
            --hue: 260;
            
            /* Light Palette */
            --primary: hsl(var(--hue), 65%, 52%);
            --on-primary: #ffffff;
            --primary-container: hsl(var(--hue), 85%, 92%);
            --on-primary-container: hsl(var(--hue), 70%, 18%);
            
            --bg: hsl(var(--hue), 20%, 98%);
            --surface: hsl(var(--hue), 18%, 95%);
            --surface-variant: hsl(var(--hue), 15%, 90%);
            --card-bg: hsl(0, 0%, 100%);
            
            --on-bg: hsl(var(--hue), 25%, 10%);
            --on-surface-variant: hsl(var(--hue), 15%, 35%);
            --border-color: hsl(var(--hue), 15%, 88%);
            
            --shadow-subtle: 0 10px 30px -10px rgba(0,0,0,0.05);
            --shadow-elevated: 0 20px 40px -15px rgba(0,0,0,0.12);
            --code-bg: hsl(var(--hue), 15%, 96%);

            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'Fira Code', monospace;
            --radius-card: 28px;
            --radius-pill: 9999px;
            --radius-md: 16px;
        }

        [data-theme="dark"] {
            /* Dark Palette */
            --primary: hsl(var(--hue), 75%, 72%);
            --on-primary: hsl(var(--hue), 80%, 12%);
            --primary-container: hsl(var(--hue), 50%, 22%);
            --on-primary-container: hsl(var(--hue), 80%, 90%);
            
            --bg: hsl(var(--hue), 15%, 7%);
            --surface: hsl(var(--hue), 14%, 11%);
            --surface-variant: hsl(var(--hue), 12%, 16%);
            --card-bg: hsl(var(--hue), 14%, 11%);
            
            --on-bg: hsl(var(--hue), 15%, 92%);
            --on-surface-variant: hsl(var(--hue), 12%, 70%);
            --border-color: hsl(var(--hue), 12%, 18%);
            
            --shadow-subtle: 0 10px 30px -10px rgba(0,0,0,0.3);
            --shadow-elevated: 0 25px 50px -12px rgba(0,0,0,0.5);
            --code-bg: hsl(var(--hue), 14%, 8%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--on-bg);
            font-family: var(--font-sans);
            transition: background-color 0.4s ease, color 0.4s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Scroll Progress Line --- */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), hsl(calc(var(--hue) + 40), 90%, 65%));
            width: 0%;
            z-index: 1000;
            transition: width 0.1s ease-out;
        }

        /* --- Glass Floating Navigation --- */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(var(--bg), 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--on-bg);
            width: 44px;
            height: 44px;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            position: relative;
        }

        .icon-btn:hover {
            background-color: var(--surface-variant);
            transform: scale(1.05);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        /* Color Preset Selector Swatches */
        .color-presets {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-color);
        }

        .swatch {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            border: 2px solid transparent;
        }

        .swatch:hover {
            transform: scale(1.2);
        }

        .swatch.active {
            border-color: var(--on-bg);
            transform: scale(1.1);
        }

        /* Reading Time Badge */
        .read-time-badge {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--on-surface-variant);
            background: var(--surface-variant);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* --- Collapsible Drawer Sidebar (TOC) --- */
        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        aside.drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 340px;
            max-width: 85vw;
            background: var(--surface);
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            border-top-right-radius: var(--radius-card);
            border-bottom-right-radius: var(--radius-card);
            box-shadow: var(--shadow-elevated);
            overflow: hidden;
        }

        aside.drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 24px 24px 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .drawer-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .toc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .toc-link {
            display: block;
            padding: 10px 16px;
            color: var(--on-surface-variant);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: var(--radius-pill);
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toc-link:hover {
            background: var(--surface-variant);
            color: var(--on-bg);
        }

        .toc-link.active {
            background: var(--primary-container);
            color: var(--on-primary-container);
            font-weight: 700;
        }

        /* --- Main Content Layout --- */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 40px 16px 80px 16px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            width: 100%;
            max-width: 880px;
            padding: 56px 64px;
            box-shadow: var(--shadow-elevated);
            border: 1px solid var(--border-color);
            transition: background-color 0.4s ease, border-color 0.4s ease;
            position: relative;
        }

        /* --- Modern Typography & Markdown Styling --- */
        .markdown-body {
            line-height: 1.8;
            font-size: 1.05rem;
            color: var(--on-bg);
        }

        .markdown-body h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--primary);
            margin-bottom: 1.5rem;
            line-height: 1.2;
            padding-bottom: 16px;
            border-bottom: 2px dashed var(--border-color);
        }

        .markdown-body h2 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            color: var(--on-bg);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .markdown-body h3 {
            font-size: 1.35rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            color: var(--on-bg);
        }

        .markdown-body p {
            margin-bottom: 1.25rem;
            color: var(--on-bg);
            opacity: 0.92;
        }

        .markdown-body a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s ease;
        }

        .markdown-body a:hover {
            border-bottom-color: var(--primary);
        }

        .markdown-body ul, .markdown-body ol {
            margin-bottom: 1.25rem;
            padding-left: 1.5rem;
        }

        .markdown-body li {
            margin-bottom: 0.5rem;
        }

        .markdown-body blockquote {
            background: var(--surface-variant);
            border-left: 4px solid var(--primary);
            padding: 16px 20px;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin: 1.5rem 0;
            font-style: italic;
            color: var(--on-surface-variant);
        }

        /* Table Formatting */
        .markdown-body table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 1.5rem 0;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .markdown-body th, .markdown-body td {
            padding: 12px 18px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .markdown-body th {
            background: var(--surface-variant);
            font-weight: 700;
            color: var(--on-bg);
        }

        .markdown-body tr:last-child td {
            border-bottom: none;
        }

        /* --- Code Block Styling --- */
        .code-wrapper {
            position: relative;
            margin: 1.5rem 0;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: var(--code-bg);
            box-shadow: var(--shadow-subtle);
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--surface-variant);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--on-surface-variant);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--on-surface-variant);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: var(--radius-pill);
            transition: background 0.2s ease, color 0.2s ease;
        }

        .copy-btn:hover {
            background: var(--surface);
            color: var(--primary);
        }

        .markdown-body pre {
            margin: 0;
            padding: 20px;
            overflow-x: auto;
            background: transparent !important;
        }

        .markdown-body code {
            font-family: var(--font-mono);
            font-size: 0.9em;
        }

        .markdown-body :not(pre) > code {
            background: var(--surface-variant);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
        }

        /* --- Skeleton Loader --- */
        .skeleton-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .skeleton {
            background: linear-gradient(90deg, var(--surface) 25%, var(--surface-variant) 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            header { padding: 10px 16px; }
            main { padding: 20px 12px 40px 12px; }
            .card { padding: 28px 20px; border-radius: 20px; }
            .markdown-body h1 { font-size: 1.85rem; }
            .markdown-body h2 { font-size: 1.4rem; }
            .color-presets { display: none; } /* Hide color presets on small screens to save space */
        }
    </style>
</head>
<body>

    <!-- Scroll Reading Indicator -->
    <div id="progress-bar"></div>

    <!-- Navigation Bar -->
    <header>
        <div class="nav-group">
            <button class="icon-btn" id="menu-btn" title="Open Table of Contents">
                <span class="material-symbols-outlined">menu_open</span>
            </button>
            <div class="read-time-badge" id="read-time">
                <span class="material-symbols-outlined" style="font-size: 16px;">schedule</span>
                <span>Calculating...</span>
            </div>
        </div>

        <div class="nav-group">
            <!-- Material Color Accent Selector -->
            <div class="color-presets">
                <div class="swatch active" style="background: hsl(260, 65%, 52%);" onclick="setAccentHue(260, this)" title="Violet"></div>
                <div class="swatch" style="background: hsl(210, 80%, 50%);" onclick="setAccentHue(210, this)" title="Blue"></div>
                <div class="swatch" style="background: hsl(150, 70%, 40%);" onclick="setAccentHue(150, this)" title="Emerald"></div>
                <div class="swatch" style="background: hsl(340, 75%, 55%);" onclick="setAccentHue(340, this)" title="Rose"></div>
                <div class="swatch" style="background: hsl(25, 85%, 50%);" onclick="setAccentHue(25, this)" title="Orange"></div>
            </div>

            <!-- Dark / Light Mode Switch Button -->
            <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle Light/Dark Theme">
                <span class="material-symbols-outlined" id="theme-icon">light_mode</span>
            </button>
        </div>
    </header>

    <!-- Sidebar Drawer (Table of Contents) -->
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="drawer" id="drawer">
        <div class="drawer-header">
            <h2>
                <span class="material-symbols-outlined">menu_book</span>
                Contents
            </h2>
            <button class="icon-btn" id="close-drawer" title="Close Menu">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="drawer-content">
            <ul class="toc-list" id="toc-tree">
                <!-- TOC Links will auto-generate here -->
            </ul>
        </div>
    </aside>

    <!-- Main Content Container -->
    <main>
        <article class="card">
            <!-- Loading Skeleton -->
            <div id="loader" class="skeleton-container">
                <div class="skeleton" style="height: 48px; width: 75%;"></div>
                <div class="skeleton" style="height: 20px; width: 40%;"></div>
                <div class="skeleton" style="height: 120px; width: 100%; margin-top: 20px;"></div>
                <div class="skeleton" style="height: 200px; width: 100%;"></div>
            </div>

            <!-- Rendered Markdown Output -->
            <div id="markdown-target" class="markdown-body" style="display: none;"></div>
        </article>
    </main>

    <script>
        // Target URL fixed directly as specified
        const RAW_MD_URL = "https://raw.githubusercontent.com/reyaansh72/csharp-basics/refs/heads/main/README.md";

        // Element references
        const drawer = document.getElementById('drawer');
        const drawerBackdrop = document.getElementById('drawer-backdrop');
        const menuBtn = document.getElementById('menu-btn');
        const closeDrawerBtn = document.getElementById('close-drawer');
        const mdTarget = document.getElementById('markdown-target');
        const loader = document.getElementById('loader');
        const tocTree = document.getElementById('toc-tree');
        const progressBar = document.getElementById('progress-bar');
        const readTimeBadge = document.getElementById('read-time').querySelector('span:last-child');

        // Configure Marked Parser
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'csharp';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-'
        });

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            fetchAndRenderMarkdown();
            setupEventListeners();
        });

        // Toggle Drawer Sidebar
        function toggleDrawer(open) {
            if (open) {
                drawer.classList.add('open');
                drawerBackdrop.classList.add('active');
            } else {
                drawer.classList.remove('open');
                drawerBackdrop.classList.remove('active');
            }
        }

        function setupEventListeners() {
            menuBtn.addEventListener('click', () => toggleDrawer(true));
            closeDrawerBtn.addEventListener('click', () => toggleDrawer(false));
            drawerBackdrop.addEventListener('click', () => toggleDrawer(false));

            // Scroll Progress Line
            window.addEventListener('scroll', () => {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                progressBar.style.width = scrolled + "%";
            });
        }

        // Fetch & Parse Markdown
        async function fetchAndRenderMarkdown() {
            try {
                const response = await fetch(RAW_MD_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const text = await response.text();

                // Convert MD to HTML
                mdTarget.innerHTML = marked.parse(text);

                // Enhance UI Elements (Code Blocks, Copy Buttons, TOC)
                enhanceCodeBlocks();
                buildTableOfContents();
                calculateReadingTime(text);

                // Reveal rendered content
                loader.style.display = 'none';
                mdTarget.style.display = 'block';

            } catch (err) {
                loader.style.display = 'none';
                mdTarget.style.display = 'block';
                mdTarget.innerHTML = `<div style="color: #ff5252; text-align: center; padding: 40px;">
                    <h2>Failed to load content</h2>
                    <p style="margin-top: 10px;">${err.message}</p>
                </div>`;
            }
        }

        // Add code block container headers and copy buttons
        function enhanceCodeBlocks() {
            const preBlocks = mdTarget.querySelectorAll('pre');
            preBlocks.forEach((pre) => {
                const code = pre.querySelector('code');
                const langMatch = code ? code.className.match(/language-(\w+)/) : null;
                const lang = langMatch ? langMatch[1] : 'code';

                // Create wrapper container
                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper';

                // Create header
                const header = document.createElement('div');
                header.className = 'code-header';
                header.innerHTML = `
                    <span>${lang}</span>
                    <button class="copy-btn" onclick="copyCode(this)">
                        <span class="material-symbols-outlined" style="font-size: 16px;">content_copy</span>
                        Copy
                    </button>
                `;

                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(header);
                wrapper.appendChild(pre);
            });
        }

        // Copy Code Block functionality
        function copyCode(btn) {
            const code = btn.closest('.code-wrapper').querySelector('code').innerText;
            navigator.clipboard.writeText(code).then(() => {
                btn.innerHTML = `<span class="material-symbols-outlined" style="font-size: 16px; color: var(--primary);">check</span> Copied!`;
                setTimeout(() => {
                    btn.innerHTML = `<span class="material-symbols-outlined" style="font-size: 16px;">content_copy</span> Copy`;
                }, 2000);
            });
        }

        // Auto Generate Table of Contents & ScrollSpy Observer
        function buildTableOfContents() {
            tocTree.innerHTML = '';
            const headings = mdTarget.querySelectorAll('h1, h2, h3');

            if (headings.length === 0) {
                tocTree.innerHTML = '<li><span class="toc-link">No sections found</span></li>';
                return;
            }

            const observerOptions = {
                root: null,
                rootMargin: '-80px 0px -60% 0px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.getAttribute('id');
                        document.querySelectorAll('.toc-link').forEach(link => {
                            link.classList.toggle('active', link.getAttribute('href') === `#${id}`);
                        });
                    }
                });
            }, observerOptions);

            headings.forEach((heading, idx) => {
                // Attach unique ID to each heading if missing
                if (!heading.id) {
                    heading.id = `section-${idx}`;
                }

                observer.observe(heading);

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.className = 'toc-link';
                a.href = `#${heading.id}`;
                a.textContent = heading.textContent.replace(/#/g, '').trim();

                // Indent based on heading level (H1, H2, H3)
                const level = parseInt(heading.tagName.replace('H', ''));
                a.style.paddingLeft = `${(level - 1) * 16 + 16}px`;

                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    toggleDrawer(false);
                });

                li.appendChild(a);
                tocTree.appendChild(li);
            });
        }

        // Estimate Reading Time
        function calculateReadingTime(text) {
            const wordsPerMinute = 200;
            const words = text.trim().split(/\s+/).length;
            const minutes = Math.ceil(words / wordsPerMinute);
            readTimeBadge.textContent = `${minutes} min read`;
        }

        // Dynamic Accent Color Switching
        function setAccentHue(hue, element) {
            document.documentElement.style.setProperty('--hue', hue);
            document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
            if (element) element.classList.add('active');
        }

        // Light / Dark Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('theme-icon');
            const hljsTheme = document.getElementById('hljs-theme');

            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                themeIcon.textContent = 'dark_mode';
                hljsTheme.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css";
            } else {
                html.setAttribute('data-theme', 'dark');
                themeIcon.textContent = 'light_mode';
                hljsTheme.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css";
            }
        }
    </script>
</body>
</html>
